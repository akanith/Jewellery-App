name: Production E2E & Security Audit Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck-and-build:
    name: Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Admin Web Dependencies
        run: npm install
        working-directory: admin-web

      - name: Install Tailwind Oxide Linux Native Binding
        run: npm install --no-save --package-lock=false @tailwindcss/oxide-linux-x64-gnu@4.3.3
        working-directory: admin-web

      - name: Verify Tailwind Oxide Native Binding
        run: node -e "require.resolve('@tailwindcss/oxide-linux-x64-gnu')"
        working-directory: admin-web

      - name: Typecheck Admin Web
        run: npx tsc --noEmit
        working-directory: admin-web

      - name: Build Admin Web
        run: npx next build
        working-directory: admin-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "mock-publishable-key-for-build"

      - name: Install Customer App Dependencies
        run: npm ci --include=optional
        working-directory: customer-app

      - name: Typecheck Customer App
        run: npx tsc --noEmit
        working-directory: customer-app

  e2e-tests:
    name: Playwright E2E & Security Audit Tests (Isolated Environment)
    needs: typecheck-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install
        working-directory: admin-web

      - name: Install Tailwind Oxide Linux Native Binding
        run: npm install --no-save --package-lock=false @tailwindcss/oxide-linux-x64-gnu@4.3.3
        working-directory: admin-web

      - name: Verify Tailwind Oxide Native Binding
        run: node -e "require.resolve('@tailwindcss/oxide-linux-x64-gnu')"
        working-directory: admin-web

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: admin-web

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Isolated Local Supabase
        run: npx supabase start

      - name: Extract Isolated Supabase Credentials
        id: supabase-env
        run: |
          SUPABASE_URL=$(npx supabase status -o json | jq -r '.API_URL')
          SUPABASE_ANON_KEY=$(npx supabase status -o json | jq -r '.ANON_KEY')
          SUPABASE_SERVICE_KEY=$(npx supabase status -o json | jq -r '.SERVICE_ROLE_KEY')
          
          echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_KEY" >> $GITHUB_ENV
          echo "E2E_ADMIN_EMAIL=admin1@gmail.com" >> $GITHUB_ENV
          echo "E2E_ADMIN_PASSWORD=admin1" >> $GITHUB_ENV

      - name: Verify Production Safety Guard
        run: |
          if [ "$NEXT_PUBLIC_SUPABASE_URL" = "https://yjpbswsgtbmgageburmy.supabase.co" ]; then
            echo "::error::FATAL: E2E test target resolved to PRODUCTION Supabase instance. Aborting job immediately!"
            exit 1
          fi
          echo "PRODUCTION SAFETY GUARD PASSED: Target URL is isolated local environment ($NEXT_PUBLIC_SUPABASE_URL)"

      - name: Provision E2E Admin Auth User
        working-directory: admin-web
        run: |
          node <<'NODE'
          const { createClient } = require('@supabase/supabase-js');

          const supabase = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );

          async function provisionAdmin() {
            const email = process.env.E2E_ADMIN_EMAIL;
            const password = process.env.E2E_ADMIN_PASSWORD;

            if (!email || !password) {
              throw new Error('E2E admin credentials are missing');
            }

            const {
              data: { users },
              error: listError
            } = await supabase.auth.admin.listUsers({
              page: 1,
              perPage: 1000
            });

            if (listError) {
              throw new Error(`Failed to list Auth users: ${listError.message}`);
            }

            const existing = users.find(
              (user) => user.email?.toLowerCase() === email.toLowerCase()
            );

            let userId;

            if (existing) {
              userId = existing.id;

              const { error: updateError } =
                await supabase.auth.admin.updateUserById(existing.id, {
                  password,
                  email_confirm: true
                });

              if (updateError) {
                throw new Error(
                  `Failed to update E2E admin Auth user: ${updateError.message}`
                );
              }

              console.log(`Updated existing E2E admin Auth user: ${email}`);
            } else {
              const {
                data: createData,
                error: createError
              } = await supabase.auth.admin.createUser({
                email,
                password,
                email_confirm: true
              });

              if (createError) {
                throw new Error(
                  `Failed to create E2E admin Auth user: ${createError.message}`
                );
              }

              userId = createData.user.id;
              console.log(`Created E2E admin Auth user: ${email}`);
            }

            const { error: profileError } = await supabase
              .from('profiles')
              .upsert(
                {
                  id: userId,
                  role: 'ADMIN',
                  phone_number: '9000000001',
                  full_name: 'E2E Admin',
                  is_active: true
                },
                { onConflict: 'id' }
              );

            if (profileError) {
              throw new Error(
                `Failed to provision profiles record: ${profileError.message}`
              );
            }

            const { error: adminError } = await supabase
              .from('admin_users')
              .upsert(
                {
                  id: userId,
                  employee_code: 'E2E-ADMIN-001',
                  is_super_admin: true,
                  role_title: 'Store Owner'
                },
                { onConflict: 'id' }
              );

            if (adminError) {
              throw new Error(
                `Failed to provision admin_users record: ${adminError.message}`
              );
            }

            console.log(`E2E admin provisioning complete: ${email}`);
          }

          provisionAdmin().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        working-directory: admin-web

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin-web/playwright-report/
          retention-days: 14
